<script>

window.onload =	function() {
	var	imageSelect	= $('#imageSelect')[0],
		imageInput = $('#imageInput')[0];
	imageSelect.addEventListener("click", function(e) {
		imageInput.click();
		e.preventDefault();
	}, false);

	imageInput.addEventListener("change", function(e) {
		handleFiles(this.files);
	}, false);

	$('#run')[0].addEventListener("click", function(e) {
		Potrace.loadImageFromUrl("yao.jpg");
		Potrace.process(function() {
			displayImg();
			displaySVG($('#svgzoom').val());
		});
	}, false);

	$('#save')[0].addEventListener("click", function(e) {
		if($('#svgimg').length){
			e.target.download =	"Potrace_" +	getFormatDate() +	".svg";
			e.target.href =	$('#svgimg').attr('src')
		}
	}, false);

	var	drop = $('#drop')[0];
	drop.addEventListener("dragenter", function(e) {
		if (e.preventDefault) e.preventDefault();
		e.dataTransfer.dropEffect =	'copy';
		this.classList.add('hovering');
		return false;
	}, false);

	drop.addEventListener("dragleave", function(e) {
		if (e.preventDefault) e.preventDefault();
		e.dataTransfer.dropEffect =	'copy';
		this.classList.remove('hovering');
		return false;
	}, false);

	drop.addEventListener("dragover", function(e) {
		if (e.preventDefault) e.preventDefault();
		e.dataTransfer.dropEffect =	'copy';
		this.classList.add('hovering');
		return false;
	}, false);

	drop.addEventListener("drop", function(e) {
		if (e.preventDefault) e.preventDefault();
		this.classList.remove('hovering');
		handleFiles(e.dataTransfer.files);
		return false;
	}, false);

	$('#svgzoom').change(function(){
		if($('#svgdiv > img').length){
			displaySVG(this.value)
		}
	})
	$('#svgcolor').on('input', function(){
		$('#svgzoom').change()
	})

	var path=strGetUrlArg(window.location.search,'file','')
	if(path){
		path=path.replace(/^.*?/,'/potrace.luhui.net')
		Potrace.loadImageFromUrl(path);
		Potrace.process(function() {
			displayImg();
			displaySVG($('#svgzoom').val());
		});
	}
};

function handleFiles(files)	{
	Potrace.loadImageFromFile(files[0]);
	Potrace.process(function() {
		displayImg();
		displaySVG($('#svgzoom').val());
	});
}

function displayImg() {
	var	imgdiv = $('#imgdiv')[0];
	imgdiv.style.display = 'inline-block';
	imgdiv.innerHTML = "<div>源图</div>";
	imgdiv.appendChild(Potrace.img);
}

function displaySVG(size, type)	{
	var	svgdiv = $('#svgdiv')[0];
	svgdiv.style.display = 'inline-block';
	var color=$('#svgcolor').val()
	var svgStr=Potrace.getSVG(size, type).replace(' fill="black" ',' fill="'+color+'" ')
	var data = 'data:image/svg+xml;base64,'+window.btoa(svgStr)
	svgdiv.innerHTML = "<div>效果</div>"	+ '<img id=svgimg src="'+data+'">';
}

function getFormatDate(){
	var e=new Date,t=e.getMonth()+1,g=e.getDate(),n=e.getHours(),a=e.getMinutes(),r=e.getSeconds();return t>=1&&t<=9&&(t="0"+t),g>=0&&g<=9&&(g="0"+g),n>=0&&n<=9&&(n="0"+n),a>=0&&a<=9&&(a="0"+a),r>=0&&r<=9&&(r="0"+r),
	//yyyy-mm-dd_MMmmss
	e.getFullYear()+"-"+t+"-"+g+"_"+n+a+r
}

//strGetUrlArg("?id=8","id",6)
function strGetUrlArg(s,sv,sd){
	var a=s.match(new RegExp("(^|&|\\?)"+sv+"=[^&]*"))
	return decodeURIComponent(a==null||sv==""?(sd||""):a[0].slice(sv.length+2))
}

</script>

<script type="text/javascript">
$(function(){
	$('body').append('<div id="dropzone" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:rgba(0,22,55,0.18);display:none;"></div>')
	var last = null;
	$(window).on('dragenter', function(e){
		last = e.target;
		$('#dropzone').fadeIn('fast')
	})
	$(window).on('dragleave', function(e){
		if(e.target === last || e.target === document){
			$('#dropzone').fadeOut('fast')
		}
	})
	$('#dropzone').on('drop', function(event){
		var ev=event.originalEvent
		var dt=ev.dataTransfer
		ev.preventDefault()
		if(dt.items && dt.items[0].kind === 'file'){
			handleFiles([dt.items[0].getAsFile()])
		}else{
			handleFiles(dt.files)
		}
		$('#dropzone').fadeOut('fast')
	})
	.on('dragover', function(event){
		event.originalEvent.preventDefault()
	})
	$('body')[0].addEventListener('paste', function(event) {
		var clipboardData = event.clipboardData || window.clipboardData
		var items = clipboardData.items
		for (var i = 0; i < items.length; i++) {
			if (items[i].type.indexOf('image') !== -1) {
				handleFiles([items[i].getAsFile()])
				break;
			}
		}
		event.preventDefault()
	})
})
</script>
